- defaults:
    link:
      relink: true
      force: true

- clean: ["~", "~/.config"]

- link:
    ~/.config/nvim: nvim
    ~/.config/fish: fish
    ~/.config/starship.toml: starship.toml
    ~/.tmux.conf: tmux.conf
    ~/Brewfile: Brewfile
    ~/.config/karabiner: karabiner
    ~/Library/Application Support/com.mitchellh.ghostty/config: ghostty/config

- shell:
    - [git submodule update --init --recursive, Installing submodules]
