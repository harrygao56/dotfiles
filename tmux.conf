bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
set -g repeat-time 800
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5
set -g mouse on

set-option -g allow-rename off
set-window-option -g mode-keys vi
set-option -g history-limit 100000
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind g run-shell 'pane=#{pane_id} && tmux display-popup -E -w 80% -h 60% -d "#{pane_current_path}" "git worktree list | fzf --reverse | awk \"{print \\\$1}\" | xargs -I {} tmux send-keys -t $pane \"cd {}\" Enter"'

# --- true color ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# --- pane borders ---
set -g pane-border-style        "fg=#3b4252"
set -g pane-active-border-style "fg=#00e5ff,bold"

# --- dim inactive pane bodies ---
set -g window-style        "fg=#a8b0bd"
set -g window-active-style "fg=#e5e9f0"

# --- pane border labels (surfaces the worktree branch set by wt) ---
set -g pane-border-status top
set -g pane-border-format "#[fg=#0b0f14,bg=#{?@pane_header_color,#{@pane_header_color},#00e5ff},bold] #{?pane_active,●,○} #{pane_index} #[default]#[fg=#e5e9f0] #{?@wt_label,#{@wt_label},#{pane_current_command}} "
run-shell -b 'script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" assign-all-colors'
set-hook -g after-split-window 'run-shell -b '\''script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" assign-color #{pane_id}'\'''
set-hook -g after-new-window 'run-shell -b '\''script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" assign-color #{pane_id}'\'''
bind r run-shell -b 'script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" refresh-window #{window_id}'
bind S run-shell -b 'script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" swap-with-mark #{pane_id}'

# --- rebalance panes into an even grid of at most 2 rows ---
bind = run-shell -b 'script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" rebalance #{window_id}'

# --- no status bar ---
set -g status off

# --- 1-indexed panes/windows + renumber ---
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# --- display-panes overlay tuning ---
set -g focus-events on
set -g display-panes-time 2000
set -g display-panes-active-colour "#00e5ff"
set -g display-panes-colour        "#4c566a"

# --- faster escape + zoom ---
set -sg escape-time 10
bind -n M-z resize-pane -Z

# --- worktree-aware code and diff review ---
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'exec "$HOME/dotfiles/tmux/open-review.sh" edit'
bind E split-window -h -c "#{pane_current_path}" 'exec "$HOME/dotfiles/tmux/open-review.sh" edit' \; run-shell -b 'script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" organize-window #{window_id}'
bind d display-popup -E -w 92% -h 92% -d "#{pane_current_path}" 'exec "$HOME/dotfiles/tmux/open-review.sh" diff'
bind D split-window -h -c "#{pane_current_path}" 'exec "$HOME/dotfiles/tmux/open-review.sh" diff' \; run-shell -b 'script_dir=$(dirname "$(readlink "$HOME/.tmux.conf" 2>/dev/null || printf "%s\n" "$HOME/.tmux.conf")"); "$script_dir/tmux/pane-tools.sh" organize-window #{window_id}'

# --- plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
