bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
set -g repeat-time 800
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
set -g mouse on
set-option -g allow-rename off
set-window-option -g mode-keys vi
set-option -g history-limit 100000
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind g run-shell 'pane=#{pane_id} && tmux display-popup -E -w 80% -h 60% "git worktree list | fzf --reverse | awk \"{print \\\$1}\" | xargs -I {} tmux send-keys -t $pane \"cd {}\" Enter"'

# --- true color ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# --- pane borders ---
set -g pane-border-style        "fg=#3b4252"
set -g pane-active-border-style "fg=#00e5ff,bold"

# --- dim inactive pane bodies ---
set -g window-style        "fg=#a8b0bd"
set -g window-active-style "fg=#e5e9f0"

# --- pane border labels (surfaces "claude:<branch>" set by wt) ---
set -g pane-border-status top
set -g pane-border-format " #[fg=#00e5ff,bold]#{?pane_active,● ,○ }#[fg=#e5e9f0]#{pane_index} #[fg=#7a8290]#{?@wt_label,#{@wt_label},#{pane_current_command}} "

# --- no status bar ---
set -g status off

# --- 1-indexed panes/windows + renumber ---
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# --- display-panes overlay tuning ---
set -g focus-events on
set -g display-panes-time 2000
set -g display-panes-active-colour "#00e5ff"
set -g display-panes-colour        "#4c566a"

# --- faster escape + zoom ---
set -sg escape-time 10
bind -n M-z resize-pane -Z
